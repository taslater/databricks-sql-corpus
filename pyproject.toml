[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-sql-corpus"
version = "0.1.0"
description = "A corpus of published Databricks SQL, and a harness that measures SQLFluff against it"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["databricks", "spark", "sql", "sqlfluff", "corpus", "conformance", "delta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: SQL",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    # The subject under test. Deliberately a floor rather than a pin: the
    # point of this project is to measure whichever SQLFluff is installed.
    # `pip install -e ../sqlfluff` inside a fork checkout measures an unmerged
    # branch, which is the main workflow.
    "sqlfluff>=4.3",
    # The reference corpus is YAML: per case it carries the statement, a
    # must-parse/must-reject verdict and the doc anchor it came from. SQLFluff
    # depends on PyYAML transitively, but the corpus should not lean on that.
    "pyyaml>=6.0",
]

[project.urls]
Source = "https://github.com/taslater/databricks-sql-corpus"
Issues = "https://github.com/taslater/databricks-sql-corpus/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    # The differential triage parser -- an advisory second opinion, never a
    # scored subject and never on the lint path. Exact pin because reports
    # record the version and sqlglot moves fast; its leniency is documented in
    # docs/sqlglot-plan.md.
    "sqlglot==30.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# The package is fully annotated; py.typed lets type checkers see that.
[tool.setuptools.package-data]
dbsqlparse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The reference harness is held at 100% line and branch coverage; `make test`
# enforces it for that module. The rest of the package predates the bar --
# `make coverage` reports it without gating.
[tool.coverage.run]
branch = true
source = ["dbsqlparse"]

[tool.coverage.report]
show_missing = true
