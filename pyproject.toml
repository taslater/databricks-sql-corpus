[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-sql-parser"
version = "0.1.0"
description = "Static parser and configurable linter for Databricks SQL, built on Spark's own ANTLR grammar"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["databricks", "spark", "sql", "linter", "parser", "antlr", "delta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: SQL",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    # Java is needed to REGENERATE the parser, never to run it -- the
    # generated sources are committed.
    "antlr4-python3-runtime==4.13.2",
    # tomllib is stdlib from 3.11; this is the only reason 3.10 needs anything.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Source = "https://github.com/taslater/databricks-sql-parser"
Issues = "https://github.com/taslater/databricks-sql-parser/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dbsqlparse = "dbsqlparse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The package is fully annotated; py.typed lets type checkers see that.
[tool.setuptools.package-data]
dbsqlparse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
