# Everything on, tuned for a tightly governed data platform. Expect this to
# produce a lot of findings on an existing codebase -- adopt it rule by rule
# rather than all at once.

# Reject SQL that only parses because Spark lets keywords be identifiers.
# Without this, `SELECT * FROM t WHERE` is valid (WHERE becomes a table alias).
ansi_reserved_keywords = true

[rules.drop-requires-if-exists]
severity = "error"

[rules.insert-requires-column-list]
severity = "error"

[rules.no-select-star]
severity = "error"
allow_qualified = false

[rules.require-comment]
severity = "error"
tables = true
columns = true
min_length = 10

[rules.require-table-provider]
severity = "error"
allowed = ["delta"]
require_explicit = true

[rules.require-table-properties]
severity = "error"
required_values = { "delta.enableChangeDataFeed" = "true" }

[rules.identifier-case]
severity = "error"
case = "snake"

[rules.identifier-length]
severity = "error"
max_length = 64

[rules.forbidden-name]
severity = "error"
patterns = { "^tmp_" = "temporary tables should not be committed", "^test_" = "test fixtures belong in a test schema", "_v[0-9]+$" = "version tables instead of using Delta time travel" }
