# snake_case with type SUFFIXES.
#
# A column's name ends with a token that tells you its type, so you can read a
# schema without looking up types. Booleans end in _ind, dates in _date and
# timestamps in _timestamp.
#
# Compare with hungarian-team.toml, which uses the opposite convention. Neither
# is the tool's recommendation -- they exist to show the same rules express
# either one.

[rules.type-naming]
severity = "error"
# Type -> regex the column name must match.
# Types are canonical: INT and INTEGER are the same, as are TIMESTAMP_NTZ and
# TIMESTAMP, VARCHAR and STRING.
patterns = { BOOLEAN = "_ind$", DATE = "_date$", TIMESTAMP = "_timestamp$", BIGINT = "_(id|key|count|amount|number)$" }
# Check both CREATE TABLE declarations and explicit CAST(x AS T) AS name.
# Columns whose type cannot be resolved from the file are always skipped.
origins = ["declaration", "cast"]

[rules.identifier-case]
severity = "error"
case = "snake"
columns = true
tables = true

[rules.identifier-length]
severity = "warning"
max_length = 128

[rules.require-comment]
severity = "warning"
tables = true
columns = true

[rules.require-table-provider]
severity = "error"
allowed = ["delta"]

[rules.no-select-star]
severity = "warning"

[rules.drop-requires-if-exists]
severity = "error"
