# snake_case with type PREFIXES -- the opposite of snake-case-team.toml.
#
# Here the type token leads: is_active rather than active_ind, dt_created
# rather than created_date. Included to make the point that the rule engine
# has no preference: the same `type-naming` rule expresses either convention,
# and neither ships as a default.

[rules.type-naming]
severity = "error"
patterns = { BOOLEAN = "^(is|has|can|should)_", DATE = "^dt_", TIMESTAMP = "^ts_", DECIMAL = "^amt_" }
origins = ["declaration", "cast"]

[rules.identifier-case]
severity = "error"
case = "snake"

[rules.forbidden-name]
severity = "warning"
# Suffix-style names are wrong under this convention.
patterns = { "_ind$" = "use an is_/has_ prefix instead of an _ind suffix", "_flag$" = "use an is_/has_ prefix instead of a _flag suffix" }

[rules.drop-requires-if-exists]
severity = "error"
