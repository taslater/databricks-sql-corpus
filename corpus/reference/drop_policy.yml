# DROP POLICY. The statement is unsupported by the databricks dialect, so the
# must-parse case is a gap and the partial rejection is vacuous until a
# grammar lands.
statement: DROP POLICY
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-policy
checked: 2026-09-20
syntax: |
  DROP POLICY policy_name
  ON { METASTORE | CATALOG catalog_name | SCHEMA schema_name | TABLE table_name }
cases:
  - id: drop-policy.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP POLICY p ON CATALOG c
  - id: drop-policy.without-target
    verdict: must-reject
    anchor: "#syntax"
    from: drop-policy.basic
    omits: "METASTORE"
    sql: |
      DROP POLICY p
