# DROP CONNECTION. The statement is unsupported by the databricks dialect, so
# the must-parse case is a gap and the partial rejection is vacuous until a
# grammar lands.
statement: DROP CONNECTION
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-connection
checked: 2026-09-20
syntax: |
  DROP CONNECTION [ IF EXISTS ] connection_name
cases:
  - id: drop-connection.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP CONNECTION c
  - id: drop-connection.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-connection.basic
    omits: "connection_name"
    sql: |
      DROP CONNECTION
