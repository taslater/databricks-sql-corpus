# FOR statement. Cases added on 2026-11-06 were each run on a Databricks SQL
# warehouse (databricks-sql-quickcheck#11).
statement: FOR statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/for-stmt
checked: 2026-09-20
syntax: |
  [ label : ] FOR [ variable_name AS ] query
    DO
    { stmt ; } [...]
    END FOR [ label ]
cases:
  - id: for-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE sum INT DEFAULT 0; FOR row AS SELECT num FROM range(1, 20) AS t(num) DO SET sum = sum + row.num; END FOR; VALUES (sum); END
  - id: for-stmt.without-do
    verdict: must-reject
    anchor: "#syntax"
    from: for-stmt.basic
    omits: "DO"
    sql: |
      BEGIN FOR row AS SELECT 1 DO END FOR; END
  - id: for-stmt.without-end-for
    verdict: must-reject
    anchor: "#syntax"
    from: for-stmt.basic
    omits: "END FOR"
    sql: |
      BEGIN FOR r AS SELECT 1 AS n DO VALUES (r.n); END; END
