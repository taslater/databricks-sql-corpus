# ALTER EXTERNAL LOCATION. The whole statement is unsupported by the
# databricks dialect, so every must-parse case is a gap and the partial
# rejection is vacuous until a grammar lands.
statement: ALTER EXTERNAL LOCATION
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-alter-location
checked: 2026-09-20
syntax: |
  ALTER EXTERNAL LOCATION location_name
    { RENAME TO to_location_name |
      SET URL url_str [ FORCE ] |
      SET STORAGE CREDENTIAL credential_name |
      [ SET ] OWNER TO principal }
cases:
  - id: alter-external-location.rename
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER EXTERNAL LOCATION l RENAME TO m
  - id: alter-external-location.set-url
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER EXTERNAL LOCATION l SET URL 's3://b/' FORCE
  - id: alter-external-location.set-credential
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER EXTERNAL LOCATION l SET STORAGE CREDENTIAL c
  - id: alter-external-location.owner
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER EXTERNAL LOCATION l OWNER TO `u`
  - id: alter-external-location.set-url-without-value
    verdict: must-reject
    anchor: "#syntax"
    from: alter-external-location.set-url
    omits: "url_str"
    sql: |
      ALTER EXTERNAL LOCATION l SET URL
