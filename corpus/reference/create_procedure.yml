# CREATE PROCEDURE. Parameters, characteristics and a compound statement
# body; the page pins the documented examples.
statement: CREATE PROCEDURE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-procedure
checked: 2026-09-20
syntax: |
  CREATE [OR REPLACE] PROCEDURE [IF NOT EXISTS]
      procedure_name ( [ procedure_parameter [, ...] ] )
      [ characteristic [...] ]
      AS compound_statement

  procedure_parameter
      [ IN | OUT | INOUT ] parameter_name data_type
      [ DEFAULT default_expression ] [ COMMENT parameter_comment ]

  characteristic
    { LANGUAGE SQL |
      SQL SECURITY { INVOKER | DEFINER } |
      NOT DETERMINISTIC |
      COMMENT procedure_comment |
      DEFAULT COLLATION default_collation_name |
      MODIFIES SQL DATA }
cases:
  - id: create-procedure.with-parameters
    verdict: must-parse
    anchor: "#examples"
    sql: |
      CREATE OR REPLACE PROCEDURE add(x INT, y INT, OUT sum INT, INOUT total INT) LANGUAGE SQL SQL SECURITY INVOKER COMMENT 'Add two numbers' AS BEGIN SET sum = x + y; SET total = total + sum; END
  - id: create-procedure.control-flow-body
    verdict: must-parse
    anchor: "#examples"
    sql: |
      CREATE PROCEDURE greeting(IN mode STRING) LANGUAGE SQL AS BEGIN SELECT 1; END
  - id: create-procedure.without-body
    verdict: must-reject
    anchor: "#syntax"
    from: create-procedure.with-parameters
    omits: "compound_statement"
    sql: |
      CREATE PROCEDURE p
