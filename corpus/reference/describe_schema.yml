# DESCRIBE SCHEMA. DESC/DESCRIBE and EXTENDED parse; this page pins them.
statement: DESCRIBE SCHEMA
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-schema
checked: 2026-09-20
syntax: |
  { DESC | DESCRIBE } SCHEMA [ EXTENDED ] schema_name
cases:
  - id: describe-schema.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE SCHEMA s
  - id: describe-schema.desc-extended
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESC SCHEMA EXTENDED s
  - id: describe-schema.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-schema.basic
    omits: "schema_name"
    sql: |
      DESCRIBE SCHEMA
