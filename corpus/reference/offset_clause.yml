# OFFSET clause. The whole clause is unsupported by the databricks dialect,
# including the combined `LIMIT n OFFSET m` form, so every must-parse case is
# a gap and the partial rejection is vacuous until a grammar lands.
statement: OFFSET clause
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-offset
checked: 2026-09-20
syntax: |
  OFFSET integer_expression
cases:
  - id: offset.number
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT * FROM t OFFSET 3
    note: Rejected by the databricks dialect on main; OFFSET has no grammar.
  - id: offset.with-limit
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT * FROM t ORDER BY a LIMIT ALL OFFSET 0
    note: Rejected by the databricks dialect on main.
  - id: offset.constant-function
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT * FROM t ORDER BY a OFFSET length('SPARK')
  - id: offset.without-expression
    verdict: must-reject
    anchor: "#syntax"
    from: offset.number
    omits: "integer_expression"
    sql: |
      SELECT * FROM t OFFSET
