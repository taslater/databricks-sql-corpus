# GRANT ON SHARE. The statement is unsupported by the databricks dialect, so
# the documented form is a gap.
statement: GRANT ON SHARE
doc: https://docs.databricks.com/aws/en/sql/language-manual/security-grant-share
checked: 2026-09-20
syntax: |
  GRANT SELECT ON SHARE share_name TO RECIPIENT recipient_name
cases:
  - id: grant-share.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      GRANT SELECT ON SHARE s TO RECIPIENT r
  - id: grant-share.without-recipient
    verdict: must-reject
    anchor: "#syntax"
    from: grant-share.basic
    omits: "recipient_name"
    sql: |
      GRANT SELECT ON SHARE s TO RECIPIENT
