# SHOW SHARES. The statement is unsupported by the databricks dialect, so the
# documented form is a gap.
statement: SHOW SHARES
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-shares
checked: 2026-09-20
syntax: |
  SHOW SHARES [ [ LIKE ] regex_pattern ]
cases:
  - id: show-shares.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW SHARES
  - id: show-shares.like
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW SHARES LIKE 'a*'
