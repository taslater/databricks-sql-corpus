# RESIGNAL statement. Scripting is unsupported by the databricks dialect, so
# the documented form is a gap.
statement: RESIGNAL statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/resignal-stmt
checked: 2026-09-20
syntax: |
  RESIGNAL
cases:
  - id: resignal-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE EXIT HANDLER FOR DIVIDE_BY_ZERO BEGIN RESIGNAL; END; SELECT 10/0; END
