# SHOW PARTITIONS. The statement and its PARTITION clause parse; this page
# pins them.
statement: SHOW PARTITIONS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-partitions
checked: 2026-09-20
syntax: |
  SHOW PARTITIONS table_name [ PARTITION clause ]
cases:
  - id: show-partitions.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW PARTITIONS t
  - id: show-partitions.partition
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW PARTITIONS t PARTITION (state = 'CA')
  - id: show-partitions.without-table
    verdict: must-reject
    anchor: "#syntax"
    from: show-partitions.basic
    omits: "table_name"
    sql: |
      SHOW PARTITIONS
