# DROP FUNCTION. The statement and its TEMPORARY form parse; this page pins
# them.
statement: DROP FUNCTION
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-function
checked: 2026-09-20
syntax: |
  DROP [ TEMPORARY ] FUNCTION [ IF EXISTS ] function_name
cases:
  - id: drop-function.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP FUNCTION f
  - id: drop-function.temporary-if-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP TEMPORARY FUNCTION IF EXISTS f
  - id: drop-function.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-function.basic
    omits: "function_name"
    sql: |
      DROP FUNCTION
