# SHOW GROUPS. The statement is unsupported by the databricks dialect, so the
# documented forms are gaps.
statement: SHOW GROUPS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-groups
checked: 2026-09-20
syntax: |
  SHOW GROUPS [ WITH USER user_principal |              WITH GROUP group_principal ]            [ [ LIKE ] regex_pattern ]
cases:
  - id: show-groups.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW GROUPS
  - id: show-groups.with-user
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW GROUPS WITH USER `u`
  - id: show-groups.with-group-like
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW GROUPS WITH GROUP g LIKE 'a*'
