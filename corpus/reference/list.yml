# LIST. The statement is unsupported by the databricks dialect, so the
# documented form is a gap.
statement: LIST
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-list
checked: 2026-09-20
syntax: |
  LIST url [ WITH ( CREDENTIAL credential_name ) ] [ LIMIT limit ]
cases:
  - id: list.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      LIST 's3://us-east-1-dev/some_dir'
  - id: list.with-credential-and-limit
    verdict: must-parse
    anchor: "#examples"
    sql: |
      LIST 's3://us-east-1-dev/some_dir' WITH (CREDENTIAL aws_some_dir) LIMIT 2
  - id: list.without-url
    verdict: must-reject
    anchor: "#syntax"
    from: list.basic
    omits: "url"
    sql: |
      LIST
