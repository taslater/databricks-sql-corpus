# DROP CREDENTIAL. The statement is unsupported by the databricks dialect, so
# the must-parse cases are gaps and the partial rejection is vacuous until a
# grammar lands.
statement: DROP CREDENTIAL
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-credential
checked: 2026-09-20
syntax: |
  DROP [ STORAGE | SERVICE ] CREDENTIAL [ IF EXISTS ] credential_name [ FORCE ]
cases:
  - id: drop-credential.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP CREDENTIAL c
  - id: drop-credential.storage-force
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP STORAGE CREDENTIAL c FORCE
  - id: drop-credential.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-credential.basic
    omits: "credential_name"
    sql: |
      DROP CREDENTIAL
