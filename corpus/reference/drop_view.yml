# DROP VIEW. The MATERIALIZED keyword is documented, and the databricks
# dialect rejects it as of SQLFluff 4.3.0, so this file carries the open gap
# recorded in docs/gaps.md.
statement: DROP VIEW
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-view
checked: 2026-09-19
syntax: DROP [ MATERIALIZED ] VIEW [ IF EXISTS ] view_name
cases:
  - id: drop-view.plain
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP VIEW v
  - id: drop-view.if-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP VIEW IF EXISTS v
  - id: drop-view.materialized
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP MATERIALIZED VIEW mv
    note: Rejected by the databricks dialect; queued upstream in docs/gaps.md.
  - id: drop-view.materialized-if-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP MATERIALIZED VIEW IF EXISTS mv
