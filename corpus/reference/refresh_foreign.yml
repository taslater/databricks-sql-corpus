# REFRESH FOREIGN. The catalog, schema and table forms parse; this page pins
# them.
statement: REFRESH FOREIGN (CATALOG, SCHEMA, and TABLE)
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-refresh-foreign
checked: 2026-09-20
syntax: |
  REFRESH FOREIGN
   { CATALOG foreign_catalog_name |
     SCHEMA foreign_schema_name [ RESOLVE DBFS LOCATION ] |
     TABLE foreign_table_name [ RESOLVE DBFS LOCATION ] }
cases:
  - id: refresh-foreign.catalog
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH FOREIGN CATALOG c
  - id: refresh-foreign.schema
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH FOREIGN SCHEMA c.s
  - id: refresh-foreign.table
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH FOREIGN TABLE c.s.t
  - id: refresh-foreign.resolve-dbfs
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH FOREIGN TABLE c.s.t RESOLVE DBFS LOCATION
  - id: refresh-foreign.without-type
    verdict: must-reject
    anchor: "#syntax"
    from: refresh-foreign.catalog
    omits: "CATALOG"
    sql: |
      REFRESH FOREIGN
