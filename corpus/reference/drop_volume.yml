# DROP VOLUME. The statement is unsupported by the databricks dialect, so the
# must-parse case is a gap and the partial rejection is vacuous until a
# grammar lands.
statement: DROP VOLUME
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-volume
checked: 2026-09-20
syntax: |
  DROP VOLUME [ IF EXISTS ] volume_name
cases:
  - id: drop-volume.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP VOLUME v
  - id: drop-volume.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-volume.basic
    omits: "volume_name"
    sql: |
      DROP VOLUME
