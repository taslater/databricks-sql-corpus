# SHOW CREDENTIALS. The statement is unsupported by the databricks dialect,
# so the documented forms are gaps.
statement: SHOW CREDENTIALS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-credentials
checked: 2026-09-20
syntax: |
  SHOW [ STORAGE | SERVICE ] CREDENTIALS
cases:
  - id: show-credentials.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW CREDENTIALS
  - id: show-credentials.storage
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW STORAGE CREDENTIALS
  - id: show-credentials.service
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW SERVICE CREDENTIALS
