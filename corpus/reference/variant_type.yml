# VARIANT type. Deliberate Tier 1.5 regression-pinning: the grammar works
# today, and these cases are the permanent record so a future rewrite cannot
# silently drop it -- the #7405 failure mode. See
# docs/reference-corpus-plan.md, "Tier 1.5". The type page's own syntax block
# is a bare keyword, but VARIANT composes with the complex types, so those
# positions are pinned here too.
statement: VARIANT
doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/variant-type
checked: 2026-09-19
syntax: |
  VARIANT
cases:
  - id: variant.column
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (v VARIANT)
  - id: variant.cast
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT CAST(x AS VARIANT)
  - id: variant.in-array
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (v ARRAY<VARIANT>)
  - id: variant.in-struct
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (s STRUCT<v: VARIANT>)
  - id: variant.with-parameters
    verdict: must-reject
    anchor: "#syntax"
    from: variant.column
    reason: extra
    extra: "VARIANT"
    sql: |
      CREATE TABLE t (v VARIANT<a: INT>)
    note: |
      The production is the bare keyword; the type takes no parameter list,
      so anything in angle brackets is supplied beyond it.
