# REPEAT statement. Cases added on 2026-11-06 were each run on a Databricks
# SQL warehouse (databricks-sql-quickcheck#11).
statement: REPEAT statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/repeat-stmt
checked: 2026-09-20
syntax: |
  [ label : ] REPEAT
    { stmt ; } [...]
    UNTIL cond
    END REPEAT [ label ]
cases:
  - id: repeat-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE num INT DEFAULT 0; sumNumbers: REPEAT SET num = num + 1; UNTIL num = 10 END REPEAT sumNumbers; END
  - id: repeat-stmt.without-until
    verdict: must-reject
    anchor: "#syntax"
    from: repeat-stmt.basic
    omits: "UNTIL"
    sql: |
      BEGIN REPEAT SET a = 1; END REPEAT; END
  - id: repeat-stmt.until-with-case-expression
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE n INT DEFAULT 0; REPEAT SET n = n + 1; UNTIL CASE WHEN n > 1 THEN true ELSE false END END REPEAT; END
  - id: repeat-stmt.string-function-is-not-a-statement
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN SELECT repeat('x', 3); END
  - id: repeat-stmt.without-end-repeat
    verdict: must-reject
    anchor: "#syntax"
    from: repeat-stmt.basic
    omits: "END REPEAT"
    sql: |
      BEGIN REPEAT VALUES (1); UNTIL true END; END
