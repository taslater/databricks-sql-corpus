# CREATE TABLE CLONE. SHALLOW and DEEP clone parse under CREATE and OR
# REPLACE; this page pins them.
statement: CREATE TABLE CLONE
doc: https://docs.databricks.com/aws/en/sql/language-manual/delta-clone
checked: 2026-09-20
syntax: |
  CREATE TABLE [IF NOT EXISTS] table_name
     [SHALLOW | DEEP] CLONE source_table_name [TBLPROPERTIES clause] [LOCATION path]
cases:
  - id: create-table-clone.deep
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t DEEP CLONE s
  - id: create-table-clone.shallow
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t SHALLOW CLONE s
  - id: create-table-clone.or-replace
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE OR REPLACE TABLE t CLONE s
  - id: create-table-clone.without-source
    verdict: must-reject
    anchor: "#syntax"
    from: create-table-clone.deep
    omits: "source_table_name"
    sql: |
      CREATE TABLE t CLONE
