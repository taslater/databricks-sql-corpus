# REFRESH (MATERIALIZED VIEW or STREAMING TABLE). The MV/ST/TABLE forms with
# FULL, WHERE and SYNC/ASYNC parse; this page pins them.
statement: REFRESH (MATERIALIZED VIEW or STREAMING TABLE)
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-refresh-full
checked: 2026-09-20
syntax: |
  REFRESH { MATERIALIZED VIEW | [ STREAMING ] TABLE } table_name
    [ FULL ] [ WHERE predicate ] [ SYNC | ASYNC ]
cases:
  - id: refresh.materialized-view
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH MATERIALIZED VIEW v
  - id: refresh.streaming-table
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH STREAMING TABLE t
  - id: refresh.table-full
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH TABLE t FULL
  - id: refresh.streaming-table-where
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH STREAMING TABLE t WHERE x > 1
  - id: refresh.without-table
    verdict: must-reject
    anchor: "#syntax"
    from: refresh.materialized-view
    omits: "table_name"
    sql: |
      REFRESH MATERIALIZED VIEW
  - id: refresh.where-without-predicate
    verdict: must-reject
    anchor: "#syntax"
    from: refresh.streaming-table-where
    omits: "predicate"
    sql: |
      REFRESH STREAMING TABLE t WHERE
