# DROP PROCEDURE. The statement and its IF EXISTS form parse; this page pins
# them.
statement: DROP PROCEDURE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-procedure
checked: 2026-09-20
syntax: |
  DROP PROCEDURE [ IF EXISTS ] procedure_name
cases:
  - id: drop-procedure.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP PROCEDURE p
  - id: drop-procedure.if-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP PROCEDURE IF EXISTS p
  - id: drop-procedure.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-procedure.basic
    omits: "procedure_name"
    sql: |
      DROP PROCEDURE
