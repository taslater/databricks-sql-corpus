# QUALIFY clause. A boolean expression over window functions parses whether
# the window function is in the SELECT list or in QUALIFY itself; this page
# pins both.
statement: QUALIFY clause
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-qualify
checked: 2026-09-20
syntax: |
  QUALIFY boolean_expression
cases:
  - id: qualify.window-in-select
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT rank() OVER (ORDER BY a) AS r FROM t QUALIFY r = 1
  - id: qualify.window-in-qualify
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT a FROM t QUALIFY RANK() OVER (ORDER BY a) = 1
  - id: qualify.without-expression
    verdict: must-reject
    anchor: "#syntax"
    from: qualify.window-in-select
    omits: "boolean_expression"
    sql: |
      SELECT a FROM t QUALIFY
