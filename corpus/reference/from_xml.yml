# from_xml function. Tier 1.5 regression-pinning for the XML ingestion
# surface: the signature, a VARIANT schema and the options map all work
# today, and the cases are the permanent record so a rewrite cannot drop
# them. Argument-count checks are not pinned, for the same reason as
# from_json.yml. See docs/reference-corpus-plan.md, "Tier 1.5".
statement: from_xml
doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/from_xml
checked: 2026-09-19
syntax: |
  from_xml(xmlStr, schema [, options])
cases:
  - id: from-xml.literal-schema
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT from_xml(c, 'a INT') FROM t
  - id: from-xml.variant-schema
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT from_xml(c, 'VARIANT') FROM t
    note: The page allows the schema to be a single VARIANT type.
  - id: from-xml.with-options
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT from_xml(c, 'a INT', map('k', 'v')) FROM t
  - id: from-xml.trailing-comma-in-options
    verdict: must-reject
    anchor: "#syntax"
    from: from-xml.literal-schema
    omits: "options"
    sql: |
      SELECT from_xml(c, 'a INT', ) FROM t
