# DROP GROUP. The statement is unsupported by the databricks dialect, so the
# documented form is a gap.
statement: DROP GROUP
doc: https://docs.databricks.com/aws/en/sql/language-manual/security-drop-group
checked: 2026-09-20
syntax: |
  DROP GROUP group_principal
cases:
  - id: drop-group.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP GROUP g
  - id: drop-group.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-group.basic
    omits: "group_principal"
    sql: |
      DROP GROUP
