# DESCRIBE CONNECTION. The statement parses; this page pins it. The object
# name is optional in the parser, so `DESCRIBE CONNECTION` is over-accepted.
statement: DESCRIBE CONNECTION
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-connection
checked: 2026-09-20
syntax: |
  { DESC | DESCRIBE } CONNECTION connection_name
cases:
  - id: describe-connection.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE CONNECTION c
  - id: describe-connection.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-connection.basic
    omits: "connection_name"
    sql: |
      DESCRIBE CONNECTION
