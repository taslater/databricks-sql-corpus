# UNDROP. The TABLE and MATERIALIZED VIEW forms parse, with a name or an id;
# this page pins them.
statement: UNDROP
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-undrop-table
checked: 2026-09-20
syntax: |
  UNDROP { MATERIALIZED VIEW | TABLE } { relation_name | WITH ID relation_id }
cases:
  - id: undrop.table
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      UNDROP TABLE t
  - id: undrop.materialized-view
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      UNDROP MATERIALIZED VIEW v
  - id: undrop.with-id
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      UNDROP TABLE WITH ID 1
  - id: undrop.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: undrop.table
    omits: "relation_name"
    sql: |
      UNDROP TABLE
  - id: undrop.with-id-without-value
    verdict: must-reject
    anchor: "#syntax"
    from: undrop.with-id
    omits: "relation_id"
    sql: |
      UNDROP TABLE WITH ID
