# SHOW FUNCTIONS. The statement with a kind, schema and pattern parses; this
# page pins it.
statement: SHOW FUNCTIONS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-functions
checked: 2026-09-20
syntax: |
  SHOW [ function_kind ] FUNCTIONS [ { FROM | IN } schema_name ]                                 [ [ LIKE ] { function_name | regex_pattern } ]
  function_kind  { USER | SYSTEM | ALL }
cases:
  - id: show-functions.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW FUNCTIONS
  - id: show-functions.system-in-schema
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW SYSTEM FUNCTIONS IN s
  - id: show-functions.like-name
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW FUNCTIONS trim
