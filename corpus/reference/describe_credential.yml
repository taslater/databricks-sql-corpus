# DESCRIBE CREDENTIAL. `DESCRIBE CREDENTIAL` parses; the `STORAGE` form does
# not, and the name is optional in the parser.
statement: DESCRIBE CREDENTIAL
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-credential
checked: 2026-09-20
syntax: |
  DESCRIBE [ STORAGE | SERVICE ] CREDENTIAL credential_name
cases:
  - id: describe-credential.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE CREDENTIAL c
  - id: describe-credential.storage
    verdict: must-parse
    anchor: "#examples"
    sql: |
      DESCRIBE STORAGE CREDENTIAL c
  - id: describe-credential.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-credential.basic
    omits: "credential_name"
    sql: |
      DESCRIBE CREDENTIAL
