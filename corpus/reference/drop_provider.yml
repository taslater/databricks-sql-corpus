# DROP PROVIDER. The statement is unsupported by the databricks dialect, so
# the must-parse case is a gap and the partial rejection is vacuous until a
# grammar lands.
statement: DROP PROVIDER
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-provider
checked: 2026-09-20
syntax: |
  DROP PROVIDER [ IF EXISTS ] provider_name
cases:
  - id: drop-provider.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP PROVIDER p
  - id: drop-provider.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-provider.basic
    omits: "provider_name"
    sql: |
      DROP PROVIDER
