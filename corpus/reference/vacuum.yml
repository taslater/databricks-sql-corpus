# VACUUM. Bare `VACUUM table_name` and `DRY RUN` parse; the FULL and LITE
# modes (DBR 16.1+) are a gap. The page's main syntax block is the Iceberg
# form; the plain form is documented under "Vacuum other tables" and is
# carried as vacuum.bare.
statement: VACUUM
doc: https://docs.databricks.com/aws/en/sql/language-manual/delta-vacuum
checked: 2026-09-20
syntax: |
  VACUUM table_name { { FULL | LITE } | DRY RUN } [...]
cases:
  - id: vacuum.bare
    verdict: must-parse
    anchor: "#syntax-1"
    sql: |
      VACUUM t
    note: From the "Vacuum other tables" syntax, VACUUM table_name.
  - id: vacuum.dry-run
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      VACUUM t DRY RUN
  - id: vacuum.full
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      VACUUM t FULL
    note: Rejected by the databricks dialect on main; the FULL and LITE modes have no grammar.
  - id: vacuum.lite
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      VACUUM t LITE
    note: Rejected by the databricks dialect on main; the FULL and LITE modes have no grammar.
  - id: vacuum.without-table
    verdict: must-reject
    anchor: "#syntax-1"
    from: vacuum.bare
    omits: "table_name"
    sql: |
      VACUUM
  - id: vacuum.full-and-lite
    verdict: must-reject
    anchor: "#syntax"
    from: vacuum.full
    reason: exclusive-alternative
    conflicts: [ "FULL", "LITE" ]
    sql: |
      VACUUM t FULL LITE
  - id: vacuum.dry-run-and-full
    verdict: must-reject
    anchor: "#syntax"
    from: vacuum.dry-run
    reason: exclusive-alternative
    conflicts: [ "FULL", "DRY RUN" ]
    sql: |
      VACUUM t DRY RUN FULL
