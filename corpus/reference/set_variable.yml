# SET variable. The assignment and tuple forms parse; this page pins them.
statement: SET variable
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-set-variable
checked: 2026-09-20
syntax: |
  SET [ VAR | VARIABLE ] { variable_name = { expression | DEFAULT } } [, ...]
  SET [ VAR | VARIABLE ] ( variable_name [, ...] ) = ( query ) }
cases:
  - id: set-variable.assignment
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SET VAR myvar1 = 5
  - id: set-variable.default
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SET VARIABLE myvar1 = DEFAULT
  - id: set-variable.tuple
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SET VAR (myvar1, myvar2) = (VALUES (10, 'world'))
