# WINDOW clause. Named window specifications, single and multiple, parse;
# this page pins them.
statement: WINDOW clause
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-named-window
checked: 2026-09-20
syntax: |
  WINDOW { window_name AS window_spec } [, ...]
cases:
  - id: window.single
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT sum(salary) OVER w FROM employees WINDOW w AS (ORDER BY salary)
  - id: window.multiple
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT sum(salary) OVER w FROM employees WINDOW w AS (ORDER BY salary), v AS (ORDER BY age)
  - id: window.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: window.single
    omits: "window_name"
    sql: |
      SELECT sum(salary) OVER w FROM employees WINDOW
  - id: window.without-spec
    verdict: must-reject
    anchor: "#syntax"
    from: window.single
    omits: "window_spec"
    sql: |
      SELECT sum(salary) OVER w FROM employees WINDOW w AS
