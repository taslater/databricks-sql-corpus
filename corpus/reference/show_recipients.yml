# SHOW RECIPIENTS. The statement is unsupported by the databricks dialect, so
# the documented form is a gap.
statement: SHOW RECIPIENTS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-recipients
checked: 2026-09-20
syntax: |
  SHOW RECIPIENTS [ [ LIKE ] regex_pattern ]
cases:
  - id: show-recipients.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW RECIPIENTS
  - id: show-recipients.like
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW RECIPIENTS LIKE 'other_org'
