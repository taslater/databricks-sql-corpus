# REFRESH FUNCTION. The statement parses; this page pins it.
statement: REFRESH FUNCTION
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-cache-refresh-function
checked: 2026-09-20
syntax: |
  REFRESH FUNCTION function_name
cases:
  - id: refresh-function.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REFRESH FUNCTION f
  - id: refresh-function.qualified
    verdict: must-parse
    anchor: "#examples"
    sql: |
      REFRESH FUNCTION s.f
  - id: refresh-function.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: refresh-function.basic
    omits: "function_name"
    sql: |
      REFRESH FUNCTION
