# DESCRIBE EXTERNAL LOCATION. The statement is unsupported by the databricks
# dialect, so the documented form is a gap.
statement: DESCRIBE EXTERNAL LOCATION
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-location
checked: 2026-09-20
syntax: |
  DESCRIBE EXTERNAL LOCATION location_name
cases:
  - id: describe-external-location.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE EXTERNAL LOCATION l
  - id: describe-external-location.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-external-location.basic
    omits: "location_name"
    sql: |
      DESCRIBE EXTERNAL LOCATION
