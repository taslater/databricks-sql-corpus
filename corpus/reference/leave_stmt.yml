# LEAVE statement. Scripting is unsupported by the databricks dialect, so the
# documented form is a gap.
statement: LEAVE statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/leave-stmt
checked: 2026-09-20
syntax: |
  LEAVE label
cases:
  - id: leave-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN sumNumbers: LOOP LEAVE sumNumbers; END LOOP sumNumbers; END
  - id: leave-stmt.without-label
    verdict: must-reject
    anchor: "#syntax"
    from: leave-stmt.basic
    omits: "label"
    sql: |
      BEGIN LOOP LEAVE; END LOOP; END
