# ARRAY type. Deliberate Tier 1.5 regression-pinning: the grammar works
# today, and these cases are the permanent record so a future rewrite cannot
# silently drop it -- the #7405 failure mode. See
# docs/reference-corpus-plan.md, "Tier 1.5".
statement: ARRAY
doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/array-type
checked: 2026-09-19
syntax: |
  ARRAY < elementType >
cases:
  - id: array.element-type
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a ARRAY<INT>)
  - id: array.nested
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a ARRAY<ARRAY<INT>>)
    note: The closing `>>` must not lex as a shift operator.
  - id: array.without-element-type
    verdict: must-reject
    anchor: "#syntax"
    from: array.element-type
    omits: "elementType"
    sql: |
      CREATE TABLE t (a ARRAY<>)
  - id: array.two-element-types
    verdict: must-reject
    anchor: "#syntax"
    from: array.element-type
    reason: extra
    extra: "elementType"
    sql: |
      CREATE TABLE t (a ARRAY<INT, STRING>)
    note: The bracket takes exactly one elementType.
