# WHERE clause. All documented predicate forms parse on main; this page pins
# them.
statement: WHERE clause
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-where
checked: 2026-09-20
syntax: |
  WHERE boolean_expression
cases:
  - id: where.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT * FROM t WHERE a > 1
  - id: where.is-null
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT * FROM t WHERE age IS NULL
  - id: where.exists-subquery
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT * FROM t WHERE EXISTS (SELECT 1 FROM s WHERE s.id = t.id)
  - id: where.between
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SELECT * FROM t WHERE a BETWEEN 1 AND 2
  - id: where.exists-without-query
    verdict: must-reject
    anchor: "#examples"
    from: where.exists-subquery
    omits: "boolean_expression"
    sql: |
      SELECT a FROM t WHERE EXISTS (* FROM u)
    note: >-
      EXISTS takes a query, so `* FROM u` is not a boolean_expression.
      The ANSI function-contents grammar over-accepts it as the argument
      list of a function named EXISTS; found by databricks-sql-quickcheck,
      2026-09-26.
  - id: where.without-expression
    verdict: must-reject
    anchor: "#syntax"
    from: where.basic
    omits: "boolean_expression"
    sql: |
      SELECT * FROM t WHERE
