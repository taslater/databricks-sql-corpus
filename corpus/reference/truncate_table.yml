# TRUNCATE TABLE. The statement and its PARTITION clause parse; this page
# pins them.
statement: TRUNCATE TABLE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-truncate-table
checked: 2026-09-20
syntax: |
  TRUNCATE TABLE table_name [ PARTITION clause ]
cases:
  - id: truncate-table.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      TRUNCATE TABLE t
  - id: truncate-table.partition
    verdict: must-parse
    anchor: "#examples"
    sql: |
      TRUNCATE TABLE t PARTITION (age = 10)
  - id: truncate-table.without-table
    verdict: must-reject
    anchor: "#syntax"
    from: truncate-table.basic
    omits: "table_name"
    sql: |
      TRUNCATE TABLE
