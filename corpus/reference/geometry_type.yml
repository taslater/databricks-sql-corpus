# GEOMETRY type. The production takes exactly one `srid | ANY` argument in
# mandatory parentheses. This is a regression-pinning transcription for the
# arity work in #8589: before the fix the type was not recognised by the
# databricks dialect at all.
statement: GEOMETRY
doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/geometry-type
checked: 2026-09-26
syntax: |
  GEOMETRY ( { srid | ANY } )
cases:
  - id: geometry.srid
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (g GEOMETRY(4326))
  - id: geometry.any
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (g GEOMETRY(ANY))
  - id: geometry.cast
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT CAST(x AS GEOMETRY(4326))
  - id: geometry.two-arguments
    verdict: must-reject
    anchor: "#syntax"
    from: geometry.srid
    reason: extra
    extra: "srid"
    sql: |
      CREATE TABLE t (g GEOMETRY(4326, 1))
    note: The bracket takes exactly one srid.
  - id: geometry.without-arguments
    verdict: must-reject
    anchor: "#syntax"
    from: geometry.srid
    omits: "( { srid | ANY } )"
    sql: |
      CREATE TABLE t (g GEOMETRY)
