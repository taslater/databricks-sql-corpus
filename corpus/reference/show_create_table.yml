# SHOW CREATE TABLE. The statement parses for a table or view; this page pins
# it.
statement: SHOW CREATE TABLE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-create-table
checked: 2026-09-20
syntax: |
  SHOW CREATE TABLE { table_name | view_name }
cases:
  - id: show-create-table.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW CREATE TABLE t
  - id: show-create-table.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: show-create-table.basic
    omits: "table_name"
    sql: |
      SHOW CREATE TABLE
