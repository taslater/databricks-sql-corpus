# SQL Pipeline Syntax. The `|>` pipeline operator is unsupported by the
# databricks dialect, so every must-parse case is a gap and the partial
# rejection is vacuous until a grammar lands.
statement: SQL Pipeline Syntax
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-pipeline
checked: 2026-09-20
syntax: |
  { FROM | TABLE } relation_name { |> piped_operation } [ ...]
cases:
  - id: sql-pipeline.select
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      FROM t |> SELECT a
    note: Rejected by the databricks dialect on main; the |> operator has no grammar.
  - id: sql-pipeline.where
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      FROM t |> WHERE a > 1
  - id: sql-pipeline.table
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      TABLE t |> SELECT a
  - id: sql-pipeline.without-operation
    verdict: must-reject
    anchor: "#syntax"
    from: sql-pipeline.select
    omits: "piped_operation"
    sql: |
      FROM t
