# SHOW SHARES IN PROVIDER. The statement is unsupported by the databricks
# dialect, so the documented form is a gap.
statement: SHOW SHARES IN PROVIDER
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-shares-in-provider
checked: 2026-09-20
syntax: |
  SHOW SHARES IN PROVIDER provider_name [ [ LIKE ] regex_pattern ]
cases:
  - id: show-shares-in-provider.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW SHARES IN PROVIDER p
  - id: show-shares-in-provider.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: show-shares-in-provider.basic
    omits: "provider_name"
    sql: |
      SHOW SHARES IN PROVIDER
