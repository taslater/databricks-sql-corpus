# DROP TABLE. The statement, its FORCE option and the TEMPORARY form parse;
# this page pins them.
statement: DROP TABLE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-table
checked: 2026-09-20
syntax: |
  DROP TABLE [ IF EXISTS ] table_name [ FORCE ]
  DROP {TEMP | TEMPORARY} TABLE table_name [IF EXISTS]
cases:
  - id: drop-table.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP TABLE t
  - id: drop-table.if-exists-force
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP TABLE IF EXISTS t FORCE
  - id: drop-table.temporary
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP TEMPORARY TABLE t
  - id: drop-table.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-table.basic
    omits: "table_name"
    sql: |
      DROP TABLE
