# CREATE GROUP. The statement is unsupported by the databricks dialect, so
# the documented forms are gaps.
statement: CREATE GROUP
doc: https://docs.databricks.com/aws/en/sql/language-manual/security-create-group
checked: 2026-09-20
syntax: |
  CREATE GROUP group_principal
    [ WITH
      [ USER user_principal [, ...] ]
      [ GROUP subgroup_principal [, ...] ]
    ]
cases:
  - id: create-group.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE GROUP g
  - id: create-group.with-user
    verdict: must-parse
    anchor: "#examples"
    sql: |
      CREATE GROUP g WITH USER `u`
  - id: create-group.with-user-and-group
    verdict: must-parse
    anchor: "#examples"
    sql: |
      CREATE GROUP g WITH USER `u` GROUP h
