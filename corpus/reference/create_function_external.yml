# CREATE FUNCTION (External). External functions declare a class and optional
# resource locations; this page pins the forms.
statement: CREATE FUNCTION (External)
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-function
checked: 2026-09-20
syntax: |
  CREATE [ OR REPLACE ] [ TEMPORARY ] FUNCTION [ IF NOT EXISTS ]
      function_name AS class_name [ resource_locations ]
cases:
  - id: create-function-external.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE FUNCTION f AS 'SimpleUdf'
  - id: create-function-external.temporary-with-jar
    verdict: must-parse
    anchor: "#examples"
    sql: |
      CREATE TEMPORARY FUNCTION f AS 'SimpleUdf' USING JAR '/tmp/x.jar'
  - id: create-function-external.or-replace-if-not-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE OR REPLACE FUNCTION IF NOT EXISTS f AS 'C' USING JAR '/tmp/x.jar'
  - id: create-function-external.without-class
    verdict: must-reject
    anchor: "#syntax"
    from: create-function-external.basic
    omits: "class_name"
    sql: |
      CREATE FUNCTION f AS
