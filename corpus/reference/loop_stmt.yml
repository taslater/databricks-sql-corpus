# LOOP statement. Cases added on 2026-11-06 were each run on a Databricks SQL
# warehouse (databricks-sql-quickcheck#11).
statement: LOOP statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/loop-stmt
checked: 2026-09-20
syntax: |
  [ label : ] LOOP
    { stmt ; } [...]
    END LOOP [ label ]
cases:
  - id: loop-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE num INT DEFAULT 0; sumNumbers: LOOP SET num = num + 1; IF num > 10 THEN LEAVE sumNumbers; END IF; END LOOP sumNumbers; END
  - id: loop-stmt.without-end
    verdict: must-reject
    anchor: "#syntax"
    from: loop-stmt.basic
    omits: "END LOOP"
    sql: |
      BEGIN LOOP SET a = 1;
  - id: loop-stmt.label-named-like-keyword
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN loop: LOOP LEAVE loop; END LOOP loop; END
    note: "Block words are not reserved as labels or names on a Databricks SQL warehouse."
