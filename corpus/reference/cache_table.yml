# CACHE TABLE. The statement, with LAZY, OPTIONS and a query, parses; this
# page pins it.
statement: CACHE TABLE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-cache-cache-table
checked: 2026-09-20
syntax: |
  CACHE [ LAZY ] TABLE table_name
    [ OPTIONS ( 'storageLevel' [ = ] value ) ] [ [ AS ] query ]
cases:
  - id: cache-table.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CACHE TABLE t
  - id: cache-table.lazy
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CACHE LAZY TABLE t
  - id: cache-table.options-and-query
    verdict: must-parse
    anchor: "#examples"
    sql: |
      CACHE TABLE t OPTIONS ('storageLevel' 'DISK_ONLY') SELECT * FROM s
  - id: cache-table.without-table
    verdict: must-reject
    anchor: "#syntax"
    from: cache-table.basic
    omits: "table_name"
    sql: |
      CACHE TABLE
