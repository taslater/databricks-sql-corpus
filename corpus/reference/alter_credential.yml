# ALTER CREDENTIAL. The whole statement is unsupported by the databricks
# dialect, so every must-parse case is a gap and the partial rejection is
# vacuous until a grammar lands.
statement: ALTER CREDENTIAL
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-alter-credential
checked: 2026-09-20
syntax: |
  ALTER [ STORAGE | SERVICE ] CREDENTIAL credential_name
    { RENAME TO to_credential_name |
      [ SET ] OWNER TO principal }
cases:
  - id: alter-credential.rename
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER CREDENTIAL c RENAME TO d
  - id: alter-credential.storage-owner
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER STORAGE CREDENTIAL c OWNER TO `u`
  - id: alter-credential.service-owner
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      ALTER SERVICE CREDENTIAL c OWNER TO `u`
  - id: alter-credential.rename-without-value
    verdict: must-reject
    anchor: "#syntax"
    from: alter-credential.rename
    omits: "to_credential_name"
    sql: |
      ALTER CREDENTIAL c RENAME TO
