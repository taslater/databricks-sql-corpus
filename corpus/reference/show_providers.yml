# SHOW PROVIDERS. The statement is unsupported by the databricks dialect, so
# the documented form is a gap.
statement: SHOW PROVIDERS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-providers
checked: 2026-09-20
syntax: |
  SHOW PROVIDERS [ [ LIKE ] regex_pattern ]
cases:
  - id: show-providers.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW PROVIDERS
  - id: show-providers.like
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW PROVIDERS LIKE 'other_org'
