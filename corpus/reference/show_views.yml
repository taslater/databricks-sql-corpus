# SHOW VIEWS. The statement with an optional schema and pattern parses; this
# page pins it.
statement: SHOW VIEWS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-views
checked: 2026-09-20
syntax: |
  SHOW VIEWS [ { FROM | IN } schema_name ] [ [ LIKE ] regex_pattern ]
cases:
  - id: show-views.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW VIEWS
  - id: show-views.from-like
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW VIEWS FROM default LIKE 'sam*'
