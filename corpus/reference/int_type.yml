# INT type. The production is the bare keyword, so the type takes no argument
# list at all. `INT(11)` (a MySQL display width) and `INT(1, 2, 3)` are both
# over-supplied; they are the must-reject cases for #8589.
statement: INT
doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/int-type
checked: 2026-09-26
syntax: |
  { INT | INTEGER }
cases:
  - id: int.column
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT)
  - id: int.integer-alias
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INTEGER)
  - id: int.cast
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT CAST(x AS INT)
  - id: int.with-arguments
    verdict: must-reject
    anchor: "#syntax"
    from: int.column
    reason: extra
    extra: "INT"
    sql: |
      CREATE TABLE t (a INT(11))
    note: |
      The production is the bare keyword; the type takes no parameter list,
      so anything in parentheses is supplied beyond it.
  - id: int.with-three-arguments
    verdict: must-reject
    anchor: "#syntax"
    from: int.column
    reason: extra
    extra: "INT"
    sql: |
      CREATE TABLE t (a INT(1, 2, 3))
