# SET RECIPIENT. The statement is unsupported by the databricks dialect, so
# the documented form is a gap.
statement: SET RECIPIENT
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-set-recipient
checked: 2026-09-20
syntax: |
  SET RECIPIENT recipient_name
cases:
  - id: set-recipient.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SET RECIPIENT nasdaq
  - id: set-recipient.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: set-recipient.basic
    omits: "recipient_name"
    sql: |
      SET RECIPIENT
