# BEGIN END compound statement. Cases added on 2026-11-06 were
# each run on a Databricks SQL warehouse (databricks-sql-quickcheck#11).
statement: BEGIN END compound statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/compound-stmt
checked: 2026-09-20
syntax: |
  [ label : ] BEGIN [ ATOMIC ] [ { declare_variable | declare_condition } ; [...] ] [ declare_cursor ; [...] ] [ declare_handler ; [...] ] [ SQL_statement ; [...] ] END [ label ]
  declare_variable
    DECLARE variable_name [, ...] datatype [ DEFAULT default_expr ]
  declare_condition
    DECLARE condition_name CONDITION [ FOR SQLSTATE [ VALUE ] sqlstate ]
  declare_cursor
    DECLARE cursor_name [ ASENSITIVE | INSENSITIVE ] CURSOR FOR query [ FOR READ ONLY ]
  declare_handler
    DECLARE handler_type HANDLER FOR condition_values handler_action
  handler_type
    EXIT | CONTINUE
  condition_values
    { { SQLSTATE [ VALUE ] sqlstate | condition_name } [, ...] | { SQLEXCEPTION | NOT FOUND } [, ...] }
cases:
  - id: compound-stmt.atomic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN ATOMIC INSERT INTO accounts VALUES (1, 'Alice', 1000); UPDATE accounts SET balance = balance + 100 WHERE id = 1; END
  - id: compound-stmt.declare-and-handler
    verdict: must-parse
    anchor: "#examples"
    sql: |
      BEGIN DECLARE a INT DEFAULT 1; DECLARE EXIT HANDLER FOR DIVIDE_BY_ZERO BEGIN VALUES (0); END; SET a = 10; VALUES (a); END
  - id: compound-stmt.empty
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN END
    note: "The statement list is bracketed in the syntax, so a block may be empty. Parses on a Databricks SQL warehouse."
  - id: compound-stmt.atomic-empty
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN ATOMIC END
    note: "Accepted on a Databricks SQL warehouse: the statement list is optional, with or without ATOMIC."
  - id: compound-stmt.nested-labelled-blocks
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN a: BEGIN VALUES (1); END a; b: BEGIN VALUES (2); END b; END
  - id: compound-stmt.sibling-label-reuse
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN a: BEGIN VALUES (1); END a; a: BEGIN VALUES (2); END a; END
    note: "Two sibling blocks may use one label; a nested block may not reuse an enclosing label."
  - id: compound-stmt.end-label-case-insensitive
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN lbl: BEGIN VALUES (1); END LBL; END
  - id: compound-stmt.without-end
    verdict: must-reject
    anchor: "#syntax"
    from: compound-stmt.atomic
    omits: "END"
    sql: |
      BEGIN ATOMIC VALUES (1);
