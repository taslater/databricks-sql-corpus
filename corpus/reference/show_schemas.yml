# SHOW SCHEMAS. The statement with an optional catalog and pattern parses;
# this page pins it.
statement: SHOW SCHEMAS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-schemas
checked: 2026-09-20
syntax: |
  SHOW SCHEMAS [ { FROM | IN } catalog_name ] [ [ LIKE ] regex_pattern ]
cases:
  - id: show-schemas.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW SCHEMAS
  - id: show-schemas.in-catalog
    verdict: must-parse
    anchor: "#examples"
    sql: |
      SHOW SCHEMAS IN c
  - id: show-schemas.like
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW SCHEMAS LIKE 'a*'
