# UNCACHE TABLE. The statement and its IF EXISTS form parse; this page pins
# them.
statement: UNCACHE TABLE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-cache-uncache-table
checked: 2026-09-20
syntax: |
  UNCACHE TABLE [ IF EXISTS ] table_name
cases:
  - id: uncache-table.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      UNCACHE TABLE t
  - id: uncache-table.if-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      UNCACHE TABLE IF EXISTS t
  - id: uncache-table.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: uncache-table.basic
    omits: "table_name"
    sql: |
      UNCACHE TABLE
