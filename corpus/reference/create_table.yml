# CREATE TABLE [USING]. The hub page has no production of its own; the
# main production lives on this sub-page (LIKE, CLONE and the Hive format
# are separate pages, still queued). Table-level DEFAULT COLLATION and
# LOCATION ... WITH (CREDENTIAL ...) are the two must-parse gaps this
# file pins; the top-level alternative set yields two over-acceptances.
statement: CREATE TABLE [USING]
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-table-using
checked: 2026-09-20
syntax: |
  { { [CREATE OR] REPLACE { TEMP | TEMPORARY } TABLE |
      CREATE [EXTERNAL] TABLE [ IF NOT EXISTS ] |
      CREATE { TEMP | TEMPORARY } TABLE }
      table_name
      [ table_specification ]
      [ USING data_source ]
      [ table_clauses ]
      [ AS query ] }

  table_specification
    ( { column_identifier column_type [ column_properties ] } [, ...]
      [ , table_constraint ] [...] )

  column_properties
    { NOT NULL |
      COLLATE collation_name |
      GENERATED ALWAYS AS ( expr ) |
      GENERATED { ALWAYS | BY DEFAULT } AS IDENTITY [ ( [ START WITH start | INCREMENT BY step ] [ ...] ) ] |
      DEFAULT default_expression |
      COMMENT column_comment |
      column_constraint |
      MASK clause } [ ... ]

  table_clauses
    { OPTIONS clause |
      PARTITIONED BY clause |
      CLUSTER BY clause |
      clustered_by_clause |
      LOCATION path [ WITH ( CREDENTIAL credential_name ) ] |
      COMMENT table_comment |
      TBLPROPERTIES clause |
      DEFAULT COLLATION default_collation_name |
      WITH { ROW FILTER clause } } [...]

  clustered_by_clause
    { CLUSTERED BY ( cluster_column [, ...] )
      [ SORTED BY ( { sort_column [ ASC | DESC ] } [, ...] ) ]
      INTO num_buckets BUCKETS }
cases:
  - id: create-table.columns
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT)
  - id: create-table.columns-multi
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT, b STRING)
  - id: create-table.if-not-exists
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE IF NOT EXISTS t (a INT)
  - id: create-table.using
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) USING delta
  - id: create-table.as-query
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t AS SELECT 1
  - id: create-table.using-and-as
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) USING delta AS SELECT 1
  - id: create-table.external
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE EXTERNAL TABLE t (a INT) LOCATION 's3://example-bucket/t'
  - id: create-table.temp
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TEMP TABLE t (a INT)
  - id: create-table.temporary
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TEMPORARY TABLE t (a INT)
  - id: create-table.replace-temp
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE OR REPLACE TEMP TABLE t (a INT)
  - id: create-table.replace-bare-temp
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      REPLACE TEMPORARY TABLE t (a INT)
    note: The REPLACE branch makes CREATE OR optional.
  - id: create-table.column-comment
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT COMMENT 'a column')
  - id: create-table.column-not-null
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT NOT NULL)
  - id: create-table.column-collate
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a STRING COLLATE UTF8_BINARY)
  - id: create-table.generated-expression
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT, b INT GENERATED ALWAYS AS (a + 1))
  - id: create-table.identity-always
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a BIGINT GENERATED ALWAYS AS IDENTITY)
  - id: create-table.identity-by-default
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a BIGINT GENERATED BY DEFAULT AS IDENTITY)
  - id: create-table.identity-options
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a BIGINT GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1))
  - id: create-table.default-expression
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT DEFAULT 0)
  - id: create-table.table-comment
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) COMMENT 'a table'
  - id: create-table.tblproperties
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) TBLPROPERTIES ('k' = 'v')
  - id: create-table.partitioned-by
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT, b INT) PARTITIONED BY (b)
  - id: create-table.cluster-by
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) CLUSTER BY (a)
  - id: create-table.clustered-by
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY (a) INTO 8 BUCKETS
  - id: create-table.clustered-sorted
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY (a) SORTED BY (a ASC) INTO 8 BUCKETS
  - id: create-table.location
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) LOCATION 's3://example-bucket/t'
  - id: create-table.location-credential
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) LOCATION 's3://example-bucket/t' WITH (CREDENTIAL cred)
    note: Rejected by the databricks dialect on main; the grammar has a credential-aware location only on other statements.
  - id: create-table.default-collation
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a STRING) DEFAULT COLLATION UTF8_BINARY
    note: Rejected by the databricks dialect on main; the table clause set has no DEFAULT COLLATION.
  - id: create-table.clause-list-repeats
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT) COMMENT 'a table' TBLPROPERTIES ('k' = 'v')
  - id: create-table.table-constraint
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      CREATE TABLE t (a INT, CONSTRAINT pk PRIMARY KEY (a))
  - id: create-table.if-not-without-exists
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.if-not-exists
    omits: "EXISTS"
    sql: |
      CREATE TABLE IF NOT t (a INT)
  - id: create-table.if-exists-without-not
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.if-not-exists
    omits: "NOT"
    sql: |
      CREATE TABLE IF EXISTS t (a INT)
  - id: create-table.column-without-type
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.columns
    omits: "column_type"
    sql: |
      CREATE TABLE t (a)
  - id: create-table.empty-column-list
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.columns
    omits: "column_identifier column_type"
    sql: |
      CREATE TABLE t ()
  - id: create-table.using-without-source
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.using
    omits: "data_source"
    sql: |
      CREATE TABLE t (a INT) USING
  - id: create-table.as-without-query
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.as-query
    omits: "query"
    sql: |
      CREATE TABLE t (a INT) AS
  - id: create-table.collate-without-name
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.column-collate
    omits: "collation_name"
    sql: |
      CREATE TABLE t (a INT COLLATE)
  - id: create-table.generated-without-expression
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.generated-expression
    omits: "( expr )"
    sql: |
      CREATE TABLE t (a INT GENERATED ALWAYS AS)
  - id: create-table.identity-without-always
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.identity-always
    omits: "{ ALWAYS | BY DEFAULT }"
    sql: |
      CREATE TABLE t (a INT GENERATED AS IDENTITY)
  - id: create-table.identity-without-step
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.identity-options
    omits: "step"
    sql: |
      CREATE TABLE t (a BIGINT GENERATED ALWAYS AS IDENTITY (INCREMENT BY))
  - id: create-table.default-without-expression
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.default-expression
    omits: "default_expression"
    sql: |
      CREATE TABLE t (a INT DEFAULT)
  - id: create-table.column-comment-without-text
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.column-comment
    omits: "column_comment"
    sql: |
      CREATE TABLE t (a INT COMMENT)
  - id: create-table.clustered-without-into
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.clustered-by
    omits: "INTO num_buckets BUCKETS"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY (a)
  - id: create-table.clustered-without-buckets
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.clustered-by
    omits: "BUCKETS"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY (a) INTO 8
  - id: create-table.clustered-without-columns
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.clustered-by
    omits: "( cluster_column [, ...] )"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY INTO 8 BUCKETS
  - id: create-table.sorted-without-column
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.clustered-sorted
    omits: "sort_column"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY (a) SORTED BY () INTO 8 BUCKETS
  - id: create-table.sorted-without-buckets
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.clustered-sorted
    omits: "num_buckets"
    sql: |
      CREATE TABLE t (a INT) CLUSTERED BY (a) SORTED BY (a ASC) INTO BUCKETS
  - id: create-table.location-without-path
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.location
    omits: "path"
    sql: |
      CREATE TABLE t (a INT) LOCATION
  - id: create-table.location-without-credential
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.location-credential
    omits: "( CREDENTIAL credential_name )"
    sql: |
      CREATE TABLE t (a INT) LOCATION 's3://example-bucket/t' WITH
  - id: create-table.default-collation-without-name
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.default-collation
    omits: "default_collation_name"
    sql: |
      CREATE TABLE t (a INT) DEFAULT COLLATION
  - id: create-table.trailing-comma
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.columns
    omits: "table_constraint"
    sql: |
      CREATE TABLE t (a INT, )
  - id: create-table.constraint-without-column
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.table-constraint
    omits: "column_identifier column_type"
    sql: |
      CREATE TABLE t (CONSTRAINT pk PRIMARY KEY (a))
  - id: create-table.external-temp
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.external
    reason: exclusive-alternative
    conflicts: [ "EXTERNAL", "TEMP | TEMPORARY" ]
    sql: |
      CREATE TEMP EXTERNAL TABLE t (a INT)
  - id: create-table.replace-with-if-not-exists
    verdict: must-reject
    anchor: "#syntax"
    from: create-table.replace-temp
    reason: exclusive-alternative
    conflicts: [ "REPLACE", "IF NOT EXISTS" ]
    sql: |
      CREATE OR REPLACE TEMP TABLE IF NOT EXISTS t (a INT)
