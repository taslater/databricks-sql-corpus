# DENY. The statement is unsupported by the databricks dialect, so the
# documented form is a gap.
statement: DENY
doc: https://docs.databricks.com/aws/en/sql/language-manual/security-deny
checked: 2026-09-20
syntax: |
  DENY privilege_types ON securable_object TO principal
  privilege_types
     { ALL PRIVLEGES |
       privilege_type [, ...] }
cases:
  - id: deny.privilege
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DENY SELECT ON TABLE t TO `u`
  - id: deny.all-privileges
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DENY ALL PRIVILEGES ON TABLE t TO `u`
  - id: deny.without-principal
    verdict: must-reject
    anchor: "#syntax"
    from: deny.privilege
    omits: "principal"
    sql: |
      DENY SELECT ON TABLE t
