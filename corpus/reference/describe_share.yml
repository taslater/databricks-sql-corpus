# DESCRIBE SHARE. The statement parses; this page pins it. The name is
# optional in the parser, so `DESCRIBE SHARE` is over-accepted.
statement: DESCRIBE SHARE
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-share
checked: 2026-09-20
syntax: |
  [ DESC | DESCRIBE ] SHARE share_name
cases:
  - id: describe-share.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE SHARE s
  - id: describe-share.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-share.basic
    omits: "share_name"
    sql: |
      DESCRIBE SHARE
