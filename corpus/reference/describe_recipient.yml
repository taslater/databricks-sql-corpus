# DESCRIBE RECIPIENT. The statement parses; this page pins it. The name is
# optional in the parser, so `DESCRIBE RECIPIENT` is over-accepted.
statement: DESCRIBE RECIPIENT
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-recipient
checked: 2026-09-20
syntax: |
  [ DESC | DESCRIBE ] RECIPIENT recipient_name
cases:
  - id: describe-recipient.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE RECIPIENT r
  - id: describe-recipient.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-recipient.basic
    omits: "recipient_name"
    sql: |
      DESCRIBE RECIPIENT
