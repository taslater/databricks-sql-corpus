# SHOW CATALOGS. The statement with an optional LIKE pattern parses; this
# page pins it.
statement: SHOW CATALOGS
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-show-catalogs
checked: 2026-09-20
syntax: |
  SHOW CATALOGS [ [ LIKE ] regex_pattern ]
cases:
  - id: show-catalogs.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW CATALOGS
  - id: show-catalogs.like
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SHOW CATALOGS LIKE 'pay*'
