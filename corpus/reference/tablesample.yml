# TABLESAMPLE clause. PERCENT, ROWS and BUCKET all parse; the REPEATABLE
# suffix is a gap.
statement: TABLESAMPLE clause
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-sampling
checked: 2026-09-20
syntax: |
  TABLESAMPLE ( { percentage PERCENT ) |
                  num_rows ROWS |
                  BUCKET fraction OUT OF total } )
              [ REPEATABLE ( seed ) ]
cases:
  - id: tablesample.percent
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT * FROM test TABLESAMPLE (30 PERCENT)
  - id: tablesample.rows
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT * FROM test TABLESAMPLE (5 ROWS)
  - id: tablesample.bucket
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT * FROM test TABLESAMPLE (BUCKET 4 OUT OF 10)
  - id: tablesample.repeatable
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT * FROM test TABLESAMPLE (30 PERCENT) REPEATABLE (123)
    note: Rejected by the databricks dialect on main; the REPEATABLE suffix has no grammar.
  - id: tablesample.without-sample
    verdict: must-reject
    anchor: "#syntax"
    from: tablesample.percent
    omits: "percentage"
    sql: |
      SELECT * FROM test TABLESAMPLE ()
  - id: tablesample.repeatable-without-seed
    verdict: must-reject
    anchor: "#syntax"
    from: tablesample.repeatable
    omits: "seed"
    sql: |
      SELECT * FROM test TABLESAMPLE (30 PERCENT) REPEATABLE ()
