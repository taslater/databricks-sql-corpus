# DESCRIBE PROVIDER. The statement parses; this page pins it. The name is
# optional in the parser, so `DESCRIBE PROVIDER` is over-accepted.
statement: DESCRIBE PROVIDER
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-describe-provider
checked: 2026-09-20
syntax: |
  [ DESC | DESCRIBE ] PROVIDER provider_name
cases:
  - id: describe-provider.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DESCRIBE PROVIDER p
  - id: describe-provider.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: describe-provider.basic
    omits: "provider_name"
    sql: |
      DESCRIBE PROVIDER
