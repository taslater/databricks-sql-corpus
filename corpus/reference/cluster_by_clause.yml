# CLUSTER BY clause (SELECT). The single- and multi-expression forms parse;
# this page pins them.
statement: CLUSTER BY clause (SELECT)
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-clusterby
checked: 2026-09-20
syntax: |
  CLUSTER BY expression [, ...]
cases:
  - id: cluster-by.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT a FROM t CLUSTER BY a
  - id: cluster-by.multiple
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      SELECT a, b FROM t CLUSTER BY a, b
  - id: cluster-by.without-expression
    verdict: must-reject
    anchor: "#syntax"
    from: cluster-by.basic
    omits: "expression"
    sql: |
      SELECT a FROM t CLUSTER BY
  - id: cluster-by.list-trailing-comma
    verdict: must-reject
    anchor: "#syntax"
    from: cluster-by.multiple
    omits: "expression"
    sql: |
      SELECT a FROM t CLUSTER BY a,
