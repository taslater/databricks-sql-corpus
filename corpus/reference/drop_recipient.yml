# DROP RECIPIENT. The statement is unsupported by the databricks dialect, so
# the must-parse case is a gap and the partial rejection is vacuous until a
# grammar lands.
statement: DROP RECIPIENT
doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-recipient
checked: 2026-09-20
syntax: |
  DROP RECIPIENT [ IF EXISTS ] recipient_name
cases:
  - id: drop-recipient.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      DROP RECIPIENT r
  - id: drop-recipient.without-name
    verdict: must-reject
    anchor: "#syntax"
    from: drop-recipient.basic
    omits: "recipient_name"
    sql: |
      DROP RECIPIENT
