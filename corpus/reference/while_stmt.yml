# WHILE statement. Scripting is unsupported by the databricks dialect, so the
# documented form is a gap.
statement: WHILE statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/while-stmt
checked: 2026-09-20
syntax: |
  [ label : ] WHILE cond DO
    { stmt ; } [...]
    END WHILE [ label ]
cases:
  - id: while-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE num INT DEFAULT 0; sumNumbers: WHILE num < 10 DO SET num = num + 1; END WHILE sumNumbers; END
  - id: while-stmt.without-do
    verdict: must-reject
    anchor: "#syntax"
    from: while-stmt.basic
    omits: "DO"
    sql: |
      BEGIN WHILE num < 10 SET num = num + 1; END WHILE; END
