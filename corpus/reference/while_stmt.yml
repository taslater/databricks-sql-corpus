# WHILE statement. Cases added on 2026-11-06 were each run on a Databricks SQL
# warehouse (databricks-sql-quickcheck#11).
statement: WHILE statement
doc: https://docs.databricks.com/aws/en/sql/language-manual/control-flow/while-stmt
checked: 2026-09-20
syntax: |
  [ label : ] WHILE cond DO
    { stmt ; } [...]
    END WHILE [ label ]
cases:
  - id: while-stmt.basic
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE num INT DEFAULT 0; sumNumbers: WHILE num < 10 DO SET num = num + 1; END WHILE sumNumbers; END
  - id: while-stmt.without-do
    verdict: must-reject
    anchor: "#syntax"
    from: while-stmt.basic
    omits: "DO"
    sql: |
      BEGIN WHILE num < 10 SET num = num + 1; END WHILE; END
  - id: while-stmt.condition-with-case-expression
    verdict: must-parse
    anchor: "#syntax"
    sql: |
      BEGIN DECLARE n INT DEFAULT 0; WHILE CASE WHEN n < 2 THEN true ELSE false END DO SET n = n + 1; END WHILE; END
  - id: while-stmt.without-end-while
    verdict: must-reject
    anchor: "#syntax"
    from: while-stmt.basic
    omits: "END WHILE"
    sql: |
      BEGIN WHILE false DO VALUES (1); END
