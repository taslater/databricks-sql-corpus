name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling is what people run.
        # 3.10 matters most: it is the only version that pulls in tomli.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make venv
      - run: make test

  generated:
    # The committed parser is a build artefact of grammar/. If the two drift,
    # every other job is testing something that is not in the repo.
    name: generated parser matches grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: make venv
      - name: Regenerate and diff
        run: make verify-generated

  corpus:
    # Reported, never gating. corpus/reports/baseline.json is committed so that
    # an accuracy change shows up in a reviewable diff -- the judgement about
    # whether a change is a regression belongs to a human, not to a threshold.
    # This job exists so that judgement has fresh numbers attached to the PR.
    name: corpus accuracy (reported)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv
      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: corpus/cache
          # Sources are pinned by revision, so the key only changes when
          # sources.py does.
          key: corpus-${{ hashFiles('src/dbsqlparse/corpus/sources.py') }}
      - run: make corpus-fetch
      - name: Measure, and diff against the committed baseline
        run: |
          make corpus CORPUS_ARGS="--json corpus/reports/pr.json"
          .venv/bin/python scripts/compare_baseline.py \
            corpus/reports/baseline.json corpus/reports/pr.json \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: corpus/reports/pr.json
