name: reference drift

# Keeps the docs-derived reference corpus current. It fetches the public
# Databricks SQL reference and reports what moved; it never edits the corpus.
# A finding is dispositioned by hand (see docs/maintenance.md), so this job's
# product is one rolling issue, not a commit.
on:
  schedule:
    # 06:17 on the 1st of each month (UTC). Off the hour on purpose.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make venv

      # Each check is captured to a file and allowed to fail without failing
      # the job: a control failure is itself something to report, not a reason
      # to lose the rest of the report.
      - name: Run the checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          make stale         > /tmp/stale.txt   2>&1
          make drift         > /tmp/drift.txt   2>&1
          make index-check   > /tmp/index.txt   2>&1
          make sources-check > /tmp/sources.txt 2>&1
          exit 0

      - name: Build the issue body and decide whether there is anything to say
        id: report
        run: |
          set -e
          # `uncertain` is deliberately not a finding here: a page whose
          # transcription is prose (`magic_cells.yml`) is permanently
          # uncertain, and paging on it every month would train the reader to
          # ignore the issue. It is still printed in the body for the human
          # pass, and `make stale` still schedules the file for re-reading.
          findings=0
          grep -Eq '^(changed|moved|fetch-error) +[1-9]' /tmp/drift.txt && findings=1
          grep -Eq '^(new|gone) +[1-9]' /tmp/index.txt && findings=1
          grep -Eq ' behind  |incomparable|ERROR ' /tmp/sources.txt && findings=1

          {
            echo "The monthly reference drift check. Nothing here edits the corpus;"
            echo "each finding is dispositioned by hand. See \`docs/maintenance.md\`"
            echo "and the ledger at \`docs/reference-drift.md\`."
            echo
            echo '```'
            cat /tmp/drift.txt
            echo
            cat /tmp/index.txt
            echo
            cat /tmp/stale.txt
            echo
            cat /tmp/sources.txt
            echo '```'
            echo
            echo "_Generated by \`.github/workflows/drift.yml\` on $(date -u +%Y-%m-%d)._"
          } > /tmp/body.md

          echo "findings=$findings" >> "$GITHUB_OUTPUT"

      - name: Open or update the rolling issue
        if: steps.report.outputs.findings == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          number=$(gh issue list --label drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/body.md
            gh issue comment "$number" --body "Refreshed $(date -u +%Y-%m-%d)."
          else
            gh issue create \
              --title "Reference drift — $(date -u +%Y-%m)" \
              --label drift \
              --body-file /tmp/body.md
          fi

      - name: Close the rolling issue when there is nothing to report
        if: steps.report.outputs.findings == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          number=$(gh issue list --label drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Clean run on $(date -u +%Y-%m-%d); closing."
          fi

      - name: Fail the job only on a control failure
        run: |
          set -e
          if grep -q "CONTROL FAILED" /tmp/drift.txt; then
            echo "drift control failed -- the verdicts are not trustworthy"
            exit 1
          fi
